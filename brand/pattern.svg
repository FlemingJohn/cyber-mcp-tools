<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760"
     preserveAspectRatio="xMidYMid slice" role="presentation">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#03102F"/>
      <stop offset="0.36" stop-color="#0B2B6B"/>
      <stop offset="0.74" stop-color="#7FA8F5"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>

    <pattern id="shields" width="30" height="34" patternUnits="userSpaceOnUse">
      <path fill="#5B9BFF"
            d="M8 4 L15 6.6 V13 C15 16.8 11.8 19.4 8 20.8 C4.2 19.4 1 16.8 1 13 V6.6 Z"/>
      <path fill="#5B9BFF" opacity="0.55"
            d="M23 21 L30 23.6 V30 C30 33.8 26.8 36.4 23 37.8 C19.2 36.4 16 33.8 16 30 V23.6 Z"/>
    </pattern>

    <radialGradient id="glow" cx="600" cy="330" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.52"/>
      <stop offset="0.6" stop-color="#9CC0FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.32" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.78" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <mask id="shieldMask">
      <rect width="1200" height="760" fill="url(#fade)"/>
    </mask>
